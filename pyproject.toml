[project]
name = "tensorloom"
version = "0.1.0"
description = "TensorLoom — A GPU-Efficient Language for AI Training"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "TensorLoom Team" }]
readme = "README.md"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
]

[project.scripts]
tlc = "tensorloom.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
