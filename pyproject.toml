[project]
name = "tensorloom"
version = "0.1.0"
description = "TensorLoom — A GPU-Efficient Domain-Specific Language for AI Training"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{ name = "TensorLoom Team" }]
readme = "README.md"
keywords = ["deep-learning", "compiler", "pytorch", "triton", "distributed-training", "dsl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]
triton = [
    'triton>=2.1.0; sys_platform == "linux"',
]

[project.scripts]
tlc = "tensorloom.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
